<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchbox — Inbox Zero for YouTube</title>
  <meta name="description" content="A Firefox extension with a finite YouTube subscriptions inbox. Save to Watch Later, dismiss the rest, and reach All caught up.">
  <meta name="theme-color" content="#001489">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead wrap">
    <a class="brand" href="./" aria-label="Watchbox home">
      <svg aria-hidden="true" width="36" height="36" viewBox="0 0 48 48">
        <rect width="48" height="48" rx="7.5" fill="#faf9f6"/>
        <g fill="#001489">
          <rect x="14.5" y="13" width="7.5" height="22" rx="2"/>
          <rect x="26" y="13" width="7.5" height="22" rx="2"/>
        </g>
      </svg>
      Watchbox
    </a>
    <a class="source" href="https://github.com/esoxjem/watchbox">GitHub <span aria-hidden="true">↗</span></a>
  </header>

  <main class="hero wrap">
    <div class="intro">
      <h1>Inbox Zero.<br>For <br class="desktop-break">YouTube.</h1>
      <p class="description">Save what matters.<br>Dismiss the rest.<br>Reach Inbox Zero.</p>
      <a class="install" href="https://github.com/esoxjem/watchbox#try-it">Try in Firefox <span aria-hidden="true">↗</span></a>
      <p class="compatibility">Desktop YouTube · Firefox 142+</p>
    </div>
    <figure class="preview">
      <img src="inbox.png" width="1440" height="800" alt="Watchbox’s Inbox in YouTube, with Inbox and Watch later at the top of the sidebar." fetchpriority="high">
    </figure>
  </main>

  <footer>
    <div class="footer-inner wrap">
      <nav aria-label="Project links">
        <a href="https://addons.mozilla.org/en-US/firefox/addon/watchbox/">Firefox Add-ons</a>
        <a href="https://github.com/esoxjem/watchbox/issues">Issues</a>
        <a href="https://github.com/esoxjem/watchbox/blob/main/LICENSE">MIT</a>
      </nav>
    </div>
  </footer>
</body>
</html>
